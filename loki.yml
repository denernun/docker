networks:
  network:
    name: network
    external: true
    driver: bridge

volumes:
  letsencrypt:
    external: true
    name: letsencrypt
  nginx-logs:
    external: true
    name: nginx-logs
  grafana:
    external: true
    name: grafana
  loki:
    external: true
    name: loki

services:
  loki:
    image: grafana/loki:latest
    hostname: loki
    container_name: loki
    restart: always
    ports:
      - '127.0.0.1:3100:3100'
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki:/loki
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3100/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-jsonsource
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana.erpclass.com.br
      - GF_SERVER_ROOT_URL=https://grafana.erpclass.com.br
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - network
    depends_on:
      - loki

  nginx:
    image: nginx:latest
    hostname: nginx
    container_name: nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/options.conf:/etc/nginx/options.conf:ro
      - ./config/general.conf:/etc/nginx/general.conf:ro
      - ./config/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./config/config.conf:/etc/nginx/conf.d/config.conf:ro
      - ./config/dhparam.pem:/etc/nginx/dhparam.pem:ro
      - letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    networks:
      - network
    depends_on:
      - grafana
      - loki
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
