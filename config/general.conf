add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; form-action 'self';" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header X-Proxy-Cache $upstream_cache_status;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Permitir underscores em cabeçalhos
underscores_in_headers on;

# Melhorar bloqueio de arquivos ocultos
location ~ /\.(?!well-known/) {
  deny all;
  log_not_found off;
  access_log off;
  return 404;
}

# Favicon
location = /favicon.ico {
  log_not_found off;
  access_log off;
}

# Robots.txt
location = /robots.txt {
  allow all;
  log_not_found off;
  access_log off;
}

# Adicionar proteção para arquivos sensíveis
location ~* \.(env|log|htaccess|htpasswd|ini|conf|bak|old|tmp)$ {
  deny all;
  log_not_found off;
  access_log off;
}
