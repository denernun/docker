# Configurações de sessão SSL
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 24h;
ssl_session_tickets off;

# Diffie-Hellman parameter
ssl_dhparam /etc/nginx/dhparam.pem;

# Atualizar protocolos - remover TLSv1.2 se possível (compatibilidade)
ssl_protocols TLSv1.2 TLSv1.3;

# Para TLS 1.3, ssl_prefer_server_ciphers deve ser off
ssl_prefer_server_ciphers on;

# Ciphers modernos otimizados para 2025
ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;

# Curvas elípticas modernas e seguras
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# Configurações de OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;

# Usar resolvers locais ou mais seguros (substitua pelos seus)
resolver 1.1.1.1 1.0.0.1 [2606:4700:4700::1111] [2606:4700:4700::1001] valid=300s;
# resolver 127.0.0.1 valid=300s;  # Use DNS local se disponível
resolver_timeout 5s;

# Adicionar configurações modernas de segurança
ssl_early_data off; # Desabilitar 0-RTT para evitar replay attacks
ssl_buffer_size 4k; # Otimizar para menor latência
