user www-data;
pid /run/nginx.pid;

worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
  multi_accept on;
	worker_connections 1024;
}

http {

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;

  charset utf-8;
  server_tokens off;
  sendfile on;
  sendfile_max_chunk 1m;
  send_timeout 10;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 29;
  keepalive_requests 100;
  reset_timedout_connection on;
  client_body_timeout 10;
  client_header_timeout 10;
  client_max_body_size 8m;
  client_body_buffer_size 128k;
  types_hash_max_size 2048;
  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  include /etc/nginx/options.conf;

  # -------------------------------------------------------------------
  # LOG FORMAT
  # -------------------------------------------------------------------

  log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for" '
  '"$host" sn="$server_name" '
  'rt=$request_time '
  'ua="$upstream_addr" us="$upstream_status" '
  'ut="$upstream_response_time" ul="$upstream_response_length" '
  'cs=$upstream_cache_status bs="$bytes_sent" rl="$request_length" gz="$gzip_ratio" '
  'upt="$upstream_connect_time" uht="$upstream_header_time"  ';

  # -------------------------------------------------------------------
  # LOGS
  # -------------------------------------------------------------------

  error_log /var/log/nginx/error.log warn;
  access_log /var/log/nginx/access.log main_ext;

  # -------------------------------------------------------------------
  # COMPRESSION
  # -------------------------------------------------------------------

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 10;
  gzip_http_version 1.1;
  gzip_comp_level 9;
  gzip_buffers 16 8k;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml text/javascript;
  gzip_disable "msie6";

  # -------------------------------------------------------------------
  # STATUS
  # -------------------------------------------------------------------

  server {
    listen 127.0.0.1:80;
    server_name 127.0.0.1;
    location /stub_status {
      stub_status on;
      access_log off;
      allow 127.0.0.1;
      deny all;
    }
  }

  # -------------------------------------------------------------------
  # CONF
  # -------------------------------------------------------------------
  include /etc/nginx/conf.d/*.conf;

}
